<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oraculum</title>
    <meta
      name="description"
      content="Oraculum — grounded question answering over your own documents. Every answer cites the retrieved evidence, or explicitly refuses to guess."
    />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("rag.theme");
          document.documentElement.classList.toggle("dark", theme !== "light");
        } catch (e) {
          /* keep default dark */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
