<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Oraculum">
  <!-- Oraculum mark: indigo rounded tile with the "O" glyph (matches the
       chat empty-state logo). Works on light and dark browser chrome. -->
  <rect width="64" height="64" rx="14" fill="#6366f1"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#ffffff" stroke-width="7"/>
  <circle cx="43" cy="21" r="4" fill="#ffffff"/>
</svg>
